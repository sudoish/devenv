- name: Terminal config
  tags:
    - terminal
  block:
    - name: Ensure ghostty dir exists
      file:
        path: ~/.config/ghostty
        state: directory

    - name: Stow ghostty config
      shell: >
        stow --adopt -t ~/.config/ghostty/ -d dotfiles ghostty

    - name: Create macOS ghostty platform overrides
      when: ansible_os_family == "Darwin"
      copy:
        dest: ~/.config/ghostty/platform.conf
        content: |
          font-size = 18

    - name: Create Arch Linux ghostty platform overrides
      when: ansible_facts["distribution"] == "Archlinux"
      copy:
        dest: ~/.config/ghostty/arch.conf
        mode: "0644"
        content: |
          # Avoid the Ghostty 1.3.1 epoll crash triggered by Herdr session redraws.
          # "auto" selects the best available backend (io_uring when available).
          async-backend = auto
      
    - name: Register fish as a login shell on macos
      when: ansible_os_family == "Darwin"
      become: yes
      lineinfile:
        path: /etc/shells
        line: "{{ '/opt/homebrew' if ansible_architecture == 'arm64' else '/usr/local' }}/bin/fish"

    - name: Change default shell to fish
      when: ansible_os_family == "Darwin"
      become: yes
      shell: >
        chsh -s {{ '/opt/homebrew' if ansible_architecture == 'arm64' else '/usr/local' }}/bin/fish {{ ansible_env.USER }}

    - name: Change default shell to fish
      when: ansible_os_family != "Darwin"
      become: yes
      shell: >
        chsh -s /usr/bin/fish {{ ansible_env.USER }}


    - name: Install fisher plugin manager for fish
      become: false
      ansible.builtin.shell: |
        fish -c 'curl -sL https://git.io/fisher | source && fisher install jorgebucaran/fisher'
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ ansible_env.HOME }}"
      when: ansible_env.SHELL is search('fish')

    - name: Ensure fish dir exists
      file:
        path: ~/.config/fish
        state: directory

    - name: Stow fish config
      shell: >
        stow --adopt -t ~/.config/fish/ -d dotfiles fish

    - name: Stow starship config
      shell: >
        stow --adopt -t ~/.config/ -d dotfiles starship

    - name: Install zoxide with Homebrew
      when: ansible_os_family == "Darwin"
      homebrew:
        name: zoxide
        state: present
